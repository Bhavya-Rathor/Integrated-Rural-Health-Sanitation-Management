spring.application.name=sanitation-service
server.port=8086

spring.datasource.url=jdbc:postgresql://ep-summer-brook-b3w7slx8.c-4.ap-southeast-1.aws.neon.tech/db_sanitation?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

#create missing tables/columns from @Entity classes at startup
spring.jpa.hibernate.ddl-auto=update
#Print every SQL statement
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

#all database work happens in the service layer
spring.jpa.open-in-view=false

# Forms send dates as 2026-10-10; this tells Spring how to read and print them
spring.mvc.format.date=yyyy-MM-dd
# Redirects use "/sanitation/..." instead of "http://localhost:8086/...", so they stay on the gateway
server.tomcat.use-relative-redirects=true