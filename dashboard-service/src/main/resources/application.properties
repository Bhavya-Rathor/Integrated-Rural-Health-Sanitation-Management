# ===== Dashboard service =====
spring.application.name=dashboard-service

# The dashboard runs on port 8088 (the gateway sends /dashboard here)
server.port=8088

# Where each teammate's service runs.
# ONLY host + port here. The API path (/api/medicines etc.) is in ServiceDirectory.java
services.medicines.url=http://localhost:8084
services.camps.url=http://localhost:8085
services.sanitation.url=http://localhost:8086
services.water.url=http://localhost:8087
services.appointments.url=http://localhost:8083

# How long to wait for a service before showing "Unavailable" (milliseconds)
services.timeout-ms=2000

# No database in this service