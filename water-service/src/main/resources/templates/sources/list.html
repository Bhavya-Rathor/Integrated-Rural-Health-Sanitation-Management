<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Water sources')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="page-header">
        <h1>Water sources</h1>
        <div>
            <a th:href="@{/water/issues}">View public-health issues</a>
            <a class="btn" th:href="@{/water/sources/new}">+ Add source</a>
        </div>
    </div>
    <p class="flash" th:if="${message}" th:text="${message}"></p>

    <form class="filters" method="get" th:action="@{/water/sources}">
        <select name="village">
            <option value="">All villages</option>
            <option th:each="v : ${villages}" th:value="${v}" th:text="${v}" th:selected="${v == selectedVillage}"></option>
        </select>
        <button type="submit" class="btn">Filter</button>
        <a th:href="@{/water/sources}">Clear</a>
    </form>

    <table class="table">
        <thead><tr><th>Name</th><th>Type</th><th>Village</th><th>Households</th><th>Working</th><th></th></tr></thead>
        <tbody>
        <tr th:each="s : ${sources}">
            <td><a th:href="@{/water/sources/{id}(id=${s.id})}" th:text="${s.name}"></a></td>
            <td th:text="${s.type}"></td>
            <td th:text="${s.village}"></td>
            <td th:text="${s.householdsServed}"></td>
            <td th:text="${s.functional} ? 'Yes' : 'No'"></td>
            <td><a th:href="@{/water/sources/{id}/edit(id=${s.id})}">Edit</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(sources)}"><td colspan="6">No sources found.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
