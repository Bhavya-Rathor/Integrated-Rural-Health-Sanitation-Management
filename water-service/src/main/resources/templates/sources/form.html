<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Water source form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <h1 th:text="${source.id == null} ? 'Add water source' : 'Edit water source'">Source</h1>

    <form class="form" method="post" th:action="@{/water/sources}" th:object="${source}">
        <input type="hidden" th:field="*{id}">

        <label>Name <input type="text" th:field="*{name}" placeholder="e.g. Gudiyatham Handpump HP-03"></label>
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

        <label>Type
            <select th:field="*{type}">
                <option value="">-- choose --</option>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
            </select>
        </label>
        <span class="error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span>

        <label>Village
            <input type="text" list="village-list" th:field="*{village}">
            <datalist id="village-list"><option th:each="v : ${villages}" th:value="${v}"></option></datalist>
        </label>
        <span class="error" th:if="${#fields.hasErrors('village')}" th:errors="*{village}"></span>

        <label>Location <input type="text" th:field="*{locationDesc}"></label>

        <label>Households served <input type="number" min="0" th:field="*{householdsServed}"></label>
        <span class="error" th:if="${#fields.hasErrors('householdsServed')}" th:errors="*{householdsServed}"></span>

        <label>Working?
            <select th:field="*{functional}">
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>
        </label>

        <div class="actions">
            <button type="submit" class="btn">Save</button>
            <a th:href="@{/water/sources}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
