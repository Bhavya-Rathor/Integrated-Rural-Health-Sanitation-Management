spring.application.name=water-service
server.port=8087

spring.datasource.url=jdbc:postgresql://ep-summer-brook-b3w7slx8.c-4.ap-southeast-1.aws.neon.tech/db_water?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.mvc.format.date=yyyy-MM-dd
server.tomcat.use-relative-redirects=true

# Where Water finds Sanitation (direct, not through the gateway)
sanitation.service.url=http://localhost:8086