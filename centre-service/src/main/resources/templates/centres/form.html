<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Centre Form</title>
    <style>
        /* Team style (same as Medicine, Dashboard, Sanitation, Health Camps) */
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f6f8; color: #222; }
        .navbar { background: #2f6f8f; padding: 10px 20px; }
        .navbar a { color: #fff; margin-right: 16px; text-decoration: none; font-size: 14px; }
        .navbar a.active { font-weight: bold; text-decoration: underline; }
        .container { max-width: 600px; margin: 24px auto; padding: 0 16px; }
        h1 { font-size: 24px; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 12px; }
        th, td { padding: 9px 12px; border-bottom: 1px solid #e3e3e3; text-align: left; font-size: 14px; }
        th { background: #eef3f6; }
        input, select { padding: 7px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .btn { display: inline-block; padding: 7px 14px; border-radius: 5px; background: #2f6f8f;
               color: #fff; text-decoration: none; border: none; cursor: pointer; font-size: 14px; }
        .btn-light { background: #e3e8ec; color: #222; }
        .btn-danger { background: #b03a2e; }
        .error { color: #b03a2e; font-size: 13px; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
        form input, form select { width: 100%; box-sizing: border-box; margin-top: 4px; }
        form input[type=checkbox] { width: auto; }
        .actions { margin-top: 18px; }
    </style>
</head>
<body>
<!-- Navbar links point at the gateway (8080) so they work even if a page is opened on its own port -->
<nav class="navbar">
    <a href="http://localhost:8080/dashboard">Dashboard</a>
    <a href="http://localhost:8080/residents">Residents</a>
    <a href="http://localhost:8080/centres" class="active">Health Centres</a>
    <a href="http://localhost:8080/appointments">Appointments</a>
    <a href="http://localhost:8080/medicines">Medicines</a>
    <a href="http://localhost:8080/camps">Health Camps</a>
    <a href="http://localhost:8080/sanitation">Sanitation</a>
    <a href="http://localhost:8080/water">Water</a>
</nav>
<div class="container">
<h1 th:text="${centre.id == null} ? 'Add centre' : 'Edit centre'">Add centre</h1>

<form th:action="@{/centres/save}" th:object="${centre}" method="post">
    <input type="hidden" th:field="*{id}">

    <label>Name</label>
    <input type="text" th:field="*{name}">
    <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

    <label>Type</label>
    <select th:field="*{type}">
        <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
    </select>
    <div class="error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>

    <label>Village</label>
    <input type="text" th:field="*{village}">
    <div class="error" th:if="${#fields.hasErrors('village')}" th:errors="*{village}"></div>

    <label>District</label>
    <input type="text" th:field="*{district}">

    <label>Phone</label>
    <input type="text" th:field="*{phone}">
    <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>

    <label>Opening time</label>
    <input type="time" th:field="*{openingTime}">

    <label>Closing time</label>
    <input type="time" th:field="*{closingTime}">

    <label><input type="checkbox" th:field="*{open24x7}" style="width:auto"> Open 24x7</label>

    <label>Status</label>
    <select th:field="*{status}">
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
    </select>

    <button class="btn" type="submit">Save</button>
    <a href="/centres" class="btn btn-light">Cancel</a>
</form>
</div>
</body>
</html>
