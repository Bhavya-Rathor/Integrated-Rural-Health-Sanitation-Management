<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Health Camps</title>
    <link rel="stylesheet" th:href="@{/camps/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h1>Health camps</h1>

    <div th:if="${message}" class="flash" th:text="${message}"></div>

    <!-- GET /camps?village=...&status=... -->
    <form class="filters" th:action="@{/camps}" method="get">
        <select name="village">
            <option value="">All villages</option>
            <option th:each="v : ${villages}" th:value="${v}" th:text="${v}"
                    th:selected="${v == selectedVillage}"></option>
        </select>
        <select name="status">
            <option value="">All statuses</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                    th:selected="${s == selectedStatus}"></option>
        </select>
        <button type="submit" class="btn">Filter</button>
        <a th:href="@{/camps}" class="btn btn-light">Clear</a>
        <a th:href="@{/camps/followups}" class="btn btn-light" style="margin-left:auto">Follow-ups</a>
        <a th:href="@{/camps/new}" class="btn">+ Plan a camp</a>
    </form>

    <table>
        <thead>
        <tr><th>Date</th><th>Camp</th><th>Type</th><th>Village</th><th>Venue</th>
            <th>Target</th><th>Status</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${camps}">
            <td th:text="${c.campDate}">2026-10-15</td>
            <td th:text="${c.name}">NCD camp</td>
            <td th:text="${c.campType}">NCD</td>
            <td th:text="${c.village}">Katpadi</td>
            <td th:text="${c.venue}">School</td>
            <td th:text="${c.targetCount}">50</td>
            <td><span class="badge" th:classappend="${c.status}" th:text="${c.status}">PLANNED</span></td>
            <td>
                <a th:href="@{/camps/{id}(id=${c.id})}">View</a> |
                <a th:href="@{/camps/{id}/edit(id=${c.id})}">Edit</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(camps)}"><td colspan="8">No camps found.</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
