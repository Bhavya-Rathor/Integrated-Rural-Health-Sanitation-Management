spring.application.name=healthcamp-service
server.port=8085

# Neon (cloud PostgreSQL), database db_camp - same Neon project as the other services.
# The password is NOT written here (public repo): set DB_PASSWORD in the IntelliJ run configuration.
spring.datasource.url=jdbc:postgresql://ep-summer-brook-b3w7slx8.c-4.ap-southeast-1.aws.neon.tech/db_camp?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# run data.sql (sample data) after Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# form fields <input type="date"> and <input type="time">
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.time=HH:mm

# send our error text (e.g. "Follow-up 3 is already DONE") in API error replies
server.error.include-message=always

resident.service.url=http://localhost:8081
centre.service.url=http://localhost:8082
