spring.application.name=medicine-service
server.port=8084

spring.datasource.url=jdbc:postgresql://ep-summer-brook-b3w7slx8.c-4.ap-southeast-1.aws.neon.tech/db_medicine?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

#create missing tables/columns from @Entity classes at startup
spring.jpa.hibernate.ddl-auto=update
#Print every SQL statement
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

#all database work happens in the service layer
spring.jpa.open-in-view=false


centre.service.url=http://localhost:8082