spring.application.name=api-gateway


# ===================================================
# API Gateway - single entry point for all services
# ===================================================
# The ONLY port the browser uses
server.port=8080

# ---------------------------------------------------
# ROUTES
# Each route = id (a name) + uri (where to forward)
#            + predicates (which paths match).
# Path=/x/**  means "/x and anything under it".
# Each service has 2 prefixes:
#   /x/**      -> its Thymeleaf pages (and CSS)
#   /api/x/**  -> its REST API (JSON)
# ---------------------------------------------------

# 0. Resident & Patient (Tvisha) - port 8081
spring.cloud.gateway.server.webflux.routes[0].id=residents
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/residents,/residents/**,/api/residents/**

# 1. Health Centre (Bhavya) - port 8082
spring.cloud.gateway.server.webflux.routes[1].id=centres
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/centres,/centres/**,/api/centres/**

# 2. Appointment & Consultation (Bhavya) - port 8083
spring.cloud.gateway.server.webflux.routes[2].id=appointments
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/appointments,/appointments/**,/api/appointments/**

# 3. Medicine & Inventory (Sambhav) - port 8084
spring.cloud.gateway.server.webflux.routes[3].id=medicines
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/medicines,/medicines/**,/api/medicines/**

# 4. Health Camp (Sanjeevni) - port 8085
spring.cloud.gateway.server.webflux.routes[4].id=camps
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/camps,/camps/**,/api/camps/**

# 5. Sanitation (Shivansh) - port 8086
spring.cloud.gateway.server.webflux.routes[5].id=sanitation
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8086
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/sanitation,/sanitation/**,/api/sanitation/**

# 6. Water & Public Health (Shivansh) - port 8087
spring.cloud.gateway.server.webflux.routes[6].id=water
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8087
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/water,/water/**,/api/water/**

# 7. Community Health Dashboard (Tvisha) - port 8088
#    "/" = home page, so localhost:8080 opens the dashboard.
#    "/dashboard" = exact page, "/dashboard/**" = its CSS and the Approve/Reject form.
spring.cloud.gateway.server.webflux.routes[7].id=dashboard
spring.cloud.gateway.server.webflux.routes[7].uri=http://localhost:8088
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/,/dashboard,/dashboard/**,/api/dashboard/**